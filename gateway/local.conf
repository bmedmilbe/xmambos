# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

server {
    # Escuta na porta dinâmica da Railway
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # DNS interno obrigatório do Railway (revalida o IP a cada 1 segundo)
    resolver 127.0.0.11 [fd12::10] valid=1s ipv6=on;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # Repassa as informações originais do cliente para o Django
    proxy_set_header Host $host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # 🔄 SERVIÇOS SECUNDÁRIOS: Identificam o prefixo e o removem antes do proxy_pass
    
    location ~ ^/certificate/(.*)$ {
        set $certificate_backend "http://${CERTIFICATE_URL}";
        # $1 envia apenas o que foi capturado depois de /certificate/
        proxy_pass $certificate_backend/$1$is_args$args;
    }

    location ~ ^/remittance/(.*)$ {
        set $remittance_backend "http://${REMITTANCE_URL}";
        # $1 envia apenas o que foi capturado depois de /remittance/
        proxy_pass $remittance_backend/$1$is_args$args;
    }

    location ~ ^/tour/(.*)$ {
        set $tour_backend "http://${TOUR_URL}";
        # $1 envia apenas o que foi capturado depois de /tour/
        proxy_pass $tour_backend/$1$is_args$args;
    }

    # Entrega de arquivos estáticos locais
    location /static/ {
        alias /home/app/web/staticfiles/;
    }

    # 🎯 ROTA RAIZ / DEFAULT (Tudo o que não tiver prefixo vai direto para o CMS)
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        set $cms_backend "http://${CMS_URL}";
        proxy_pass $cms_backend;
    }
}
