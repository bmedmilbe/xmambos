# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

# 🌐 DEFINIÇÃO ESTÁTICA DOS BACKENDS (Evita o erro de resolução de variáveis dinâmicas)
upstream cms_subsystem {
    server cms.railway.internal:8000;
}

upstream certificate_subsystem {
    server certificate.railway.internal:8000;
}

upstream remittance_subsystem {
    server remittance.railway.internal:8000;
}

upstream tour_subsystem {
    server tour.railway.internal:8000;
}

server {
    # Escuta na porta dinâmica da Railway
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # DNS padrão interno para failover rápido
    resolver 127.0.0.11 valid=5s;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # Preserva o Host original para o django-tenants funcionar perfeitamente
    proxy_set_header Host $host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT / WORDPRESS
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # 🔄 ROTEAMENTO VIA UPSTREAM (Sem usar variáveis no proxy_pass)

    location /certificate/ {
        proxy_pass http://certificate_subsystem/;
    }

    location /remittance/ {
        proxy_pass http://remittance_subsystem/;
    }

    location /tour/ {
        proxy_pass http://tour_subsystem/;
    }

    location /cms/ {
        proxy_pass http://cms_subsystem/;
    }

    # Rota raiz direcionada ao CMS principal
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://cms_subsystem;
    }

    # Entrega de arquivos estáticos locais
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}