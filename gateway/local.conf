server {
    listen 8080 default_server;
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;
    
    client_max_body_size 100M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    # Health check
    location /health {
        access_log off;
        return 200 "Gateway OK\n";
        add_header Content-Type text/plain;
    }

    # Debug com variáveis de ambiente
    location /debug-vars {
        access_log off;
        return 200 "CMS_URL: ${CMS_URL}\nTOUR_URL: ${TOUR_URL}\nREMITTANCE_URL: ${REMITTANCE_URL}\nCERTIFICATE_URL: ${CERTIFICATE_URL}\n";
        add_header Content-Type text/plain;
    }

    # Definindo backends com variáveis de ambiente
    set $certificate_backend "${CERTIFICATE_URL}";
    set $remittance_backend "${REMITTANCE_URL}";
    set $tour_backend "${TOUR_URL}";
    set $cms_backend "${CMS_URL}";

    # Serviço: Certificates
    location /certificates/ {
        if ($certificate_backend = "") {
            return 503 "Certificate service unavailable";
        }
        proxy_pass http://$certificate_backend/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/certificates/(.*) /$1 break;
    }

    # Serviço: Remittance
    location /remittance/ {
        if ($remittance_backend = "") {
            return 503 "Remittance service unavailable";
        }
        proxy_pass http://$remittance_backend/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/remittance/(.*) /$1 break;
    }

    # Serviço: Tour
    location /tour/ {
        if ($tour_backend = "") {
            return 503 "Tour service unavailable";
        }
        proxy_pass http://$tour_backend/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/tour/(.*) /$1 break;
    }

    # Serviço: CMS
    location /cms/ {
        if ($cms_backend = "") {
            return 503 "CMS service unavailable";
        }
        proxy_pass http://$cms_backend/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/cms/(.*) /$1 break;
    }

    # Rota principal - CMS
    location / {
        if ($cms_backend = "") {
            return 503 "CMS service unavailable";
        }
        proxy_pass http://$cms_backend/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}