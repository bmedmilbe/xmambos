server {
    # Escuta na porta dinâmica injetada pela Railway
    listen ${PORT}; 

    # Aceita tráfego do domínio raiz e subdomínios wildcards
    server_name teladoshi.com *.teladoshi.com;

    # CORREÇÃO CRUCIAL: IP do DNS IPv6 nativo da infraestrutura Railway
    resolver [fd12::10] ipv6=on valid=1s;

    # Cabeçalhos para o django-tenants identificar subdomínios
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Rota raiz (Fallback para o CMS usando variável)
    location / {
        proxy_pass http://${CMS_URL};
    }

    # Central Management System (CMS)
    location /cms/ {
        proxy_pass http://${CMS_URL}/;
    }

    # Motor de Turismo
    location /tour/ {
        proxy_pass http://${TOUR_URL}/; 
    }

    # Pipeline de Remessas Financeiras
    location /remittance/ {
        proxy_pass http://${REMITTANCE_URL}/; 
    }

    # Motor de Certificados
    location /certificate/ {
        proxy_pass http://${CERTIFICATE_URL}/; 
    }
    
    # Arquivos estáticos
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
