upstream cms_service {
    server web_cms:8000;
}
upstream tour_service {
    server web_tour:8000;
}
upstream remittance_service {
    server web_remittance:8000;
}
upstream certificate_service {
    server web_certificate:8000;
}

server {
    listen 80;

    # Universal proxy configurations to keep it DRY
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location / {
        proxy_pass http://cms_service;
    }

    location /cms/ {
        proxy_pass http://cms_service/;
    }

    location /tour/ {
        proxy_pass http://tour_service/; 
    }
    location /troca/ {
        proxy_pass http://remittance_service/; 
    }
    location /cert/ {
        proxy_pass http://certificate_service/; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}