server {
    # Listen on the dynamic port injected by Railway at runtime
    listen ${PORT}; 

    # Accept traffic from both the root domain and all multi-tenant wildcards
    server_name teladoshi.com *.teladoshi.com;

    # Internal Railway DNS resolver used to dynamically map container target names
    resolver 127.0.0.11 valid=30s;

    # Pass the original host header so django-tenants can parse the subdomains correctly
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Root location mapping to catch fallback tenant routes cleanly
    location / {
        proxy_pass http://${CMS_URL};
    }

    # Dedicated routing block for Central Management System services
    location /cms/ {
        proxy_pass http://${CMS_URL}/;
    }

    # Dedicated routing block for Tourism engine application clusters
    location /tour/ {
        proxy_pass http://${TOUR_URL}/; 
    }

    # Dedicated routing block for Financial Remittance pipeline services
    location /remittance/ {
        proxy_pass http://${REMITTANCE_URL}/; 
    }

    # Dedicated routing block for cryptographic validation and certificate engines
    location /certificate/ {
        proxy_pass http://${CERTIFICATE_URL}/; 
    }
    
    # Static asset delivery serving global shared frontend dependencies
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}