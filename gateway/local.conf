# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

server {
    # Escuta na porta dinâmica da Railway
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # DNS interno obrigatório para resolver as strings em runtime
    resolver 127.0.0.11 [fd12::10] valid=5s ipv6=on;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # 🚨 CORREÇÃO CANÔNICA PARA DJANGO-TENANTS: Usa $host para preservar o domínio limpo
    proxy_set_header Host $host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT / WORDPRESS
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # 🔄 SUB-ROTAS DOS SERVIÇOS SECUNDÁRIOS
    # Removem o prefixo da URL usando Regex para o microsserviço receber a rota limpa
    
    location ~ ^/certificate/(.*)$ {
        set $certificate_target "http://railway.internal";
        proxy_pass $certificate_target;
    }

    location ~ ^/remittance/(.*)$ {
        set $remittance_target "http://railway.internal";
        proxy_pass $remittance_target;
    }

    location ~ ^/tour/(.*)$ {
        set $tour_target "http://railway.internal";
        proxy_pass $tour_target;
    }

    # Entrega de arquivos estáticos locais (processados antes da rota raiz)
    location /static/ {
        alias /home/app/web/staticfiles/;
    }

    # 🎯 ROTA RAIZ / CATCH-ALL (Encaminhamento total para o CMS)
    # Qualquer rota que não case com os blocos acima cai aqui e vai direto para o CMS
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        set $root_target "http://railway.internal";
        proxy_pass $root_target;
    }
}
