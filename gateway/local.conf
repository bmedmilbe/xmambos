# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

server {
    # Escuta na porta dinâmica da Railway
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # DNS IPv6 interno nativo da Railway para evitar o erro 502
    resolver 127.0.0.11 [fd12::10] valid=1s;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # Preserva o Host original para o django-tenants funcionar perfeitamente
    proxy_set_header Host $host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT: Bloqueia extensões críticas conhecidas (.php, .env, .ini, .sql)
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }

    # 🛡️ PROTEÇÃO ANTI-WORDPRESS: Rejeita varreduras comuns que congestionam o gateway
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # Rota de Certificados (Remove /certificate/ ao enviar para o container)
    location /certificate/ {
        proxy_pass http://${CERTIFICATE_URL}/;
    }

    # Rota de Remessas (Remove /remittance/ ao enviar para o container)
    location /remittance/ {
        proxy_pass http://${REMITTANCE_URL}/;
    }

    # Rota de Turismo (Remove /tour/ ao enviar para o container)
    location /tour/ {
        proxy_pass http://${TOUR_URL}/;
    }

    # Rota do CMS explicitada (Remove /cms/ ao enviar para o container)
    location /cms/ {
        proxy_pass http://${CMS_URL}/;
    }

    # Rota raiz e fallbacks com aplicação de Rate Limiting contra ataques de negação de serviço
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://${CMS_URL};
    }

    # Entrega de arquivos estáticos locais
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
