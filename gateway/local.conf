server {
    listen ${PORT} default_server;
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;
    
    client_max_body_size 100M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Logs para debug
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    # Health check do gateway
    location /health {
        access_log off;
        return 200 "Gateway OK\n";
        add_header Content-Type text/plain;
    }

    # Debug das variáveis de ambiente
    location /debug-vars {
        access_log off;
        return 200 "CMS_URL: $CMS_URL\nTOUR_URL: $TOUR_URL\nREMITTANCE_URL: $REMITTANCE_URL\nCERTIFICATE_URL: $CERTIFICATE_URL\n";
        add_header Content-Type text/plain;
    }

    # ============= CERTIFICATE SERVICE =============
    set $certificate_upstream "$CERTIFICATE_URL";
    
    location /certificates/ {
        if ($certificate_upstream = "") {
            return 503 "Certificate service unavailable";
        }
        proxy_pass http://$certificate_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        rewrite ^/certificates/(.*) /$1 break;
    }

    # ============= REMITTANCE SERVICE =============
    set $remittance_upstream "$REMITTANCE_URL";
    
    location /remittance/ {
        if ($remittance_upstream = "") {
            return 503 "Remittance service unavailable";
        }
        proxy_pass http://$remittance_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        rewrite ^/remittance/(.*) /$1 break;
    }

    # ============= TOUR SERVICE =============
    set $tour_upstream "$TOUR_URL";
    
    location /tour/ {
        if ($tour_upstream = "") {
            return 503 "Tour service unavailable";
        }
        proxy_pass http://$tour_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        rewrite ^/tour/(.*) /$1 break;
    }

    # ============= CMS SERVICE =============
    set $cms_upstream "$CMS_URL";
    
    location /cms/ {
        if ($cms_upstream = "") {
            return 503 "CMS service unavailable";
        }
        proxy_pass http://$cms_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        rewrite ^/cms/(.*) /$1 break;
    }

    # ============= ROTA PRINCIPAL (CMS) =============
    location / {
        if ($cms_upstream = "") {
            return 503 "CMS service unavailable";
        }
        proxy_pass http://$cms_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    }

    # ============= ERROR PAGES =============
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}