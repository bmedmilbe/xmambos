server {
    listen 80;

    # Universal proxy configurations to keep things DRY
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # 1. Use dynamic runtime variables to trick Nginx into skipping boot-time checks
    location / {
        proxy_pass $cms_backend;
    }

    location /cms/ {
        proxy_pass "${cms_backend}/";
    }

    location /tour/ {
        proxy_pass "${tour_backend}/"; 
    }

    location /remittance/ {
        proxy_pass "${remittance_backend}/"; 
    }

    location /certificate/ {
        proxy_pass "${certificate_backend}/"; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
