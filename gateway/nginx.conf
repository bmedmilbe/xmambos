server {
    # Listen on the public port injected by Railway
    listen ${PORT}; 

    # Force Nginx to resolve backend service locations dynamically via IPv6
    resolver [fd12::10] valid=5s;

    # Production Proxy Buffers to handle large Django headers cleanly
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Universal proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Crucial for Railway IPv6 internal mesh architectures
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_redirect off;

    # Dynamic targets mapping to variables to bypass validation timeouts
    location / {
        set $cms_target "http://${CMS_URL}";
        proxy_pass $cms_target;
    }

    location /cms/ {
        set $cms_target "http://${CMS_URL}/";
        proxy_pass $cms_target;
    }

    location /tour/ {
        set $tour_target "http://${TOUR_URL}/";
        proxy_pass $tour_target; 
    }

    location /remittance/ {
        set $remittance_target "http://${REMITTANCE_URL}/";
        proxy_pass $remittance_target; 
    }

    location /certificate/ {
        set $cert_target "http://${CERTIFICATE_URL}/";
        proxy_pass $cert_target; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
