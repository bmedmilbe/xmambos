# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

# 🌐 DEFINIÇÃO DOS UPSTREAMS (Conexão direta com a rede interna da Railway)
# O Nginx resolve esses nomes no boot e mantém a conexão persistente e limpa.
upstream cms_backend {
    server cms.railway.internal:8000;
}

upstream tour_backend {
    server tour.railway.internal:8000;
}

upstream remittance_backend {
    server remittance.railway.internal:8000;
}

upstream certificate_backend {
    server certificate.railway.internal:8000;
}

server {
    # Escuta na porta dinâmica da Railway (Única variável que mantemos para o envsubst)
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # DNS padrão interno
    resolver 127.0.0.11 [fd12::10] valid=5s;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # Preserva o Host original para o django-tenants funcionar perfeitamente
    proxy_set_header Host $host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT / WORDPRESS
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # Rota de Certificados
    location /certificate/ {
        proxy_pass http://certificate_backend/;
    }

    # Rota de Remessas
    location /remittance/ {
        proxy_pass http://remittance_backend/;
    }

    # Rota de Turismo
    location /tour/ {
        proxy_pass http://tour_backend/;
    }

    # Rota do CMS explicitada
    location /cms/ {
        proxy_pass http://cms_backend/;
    }

    # Rota raiz e fallbacks com Rate Limiting
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://cms_backend;
    }

    # Entrega de arquivos estáticos locais
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}