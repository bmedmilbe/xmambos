server {
    listen 80;

    # Fix: Point exclusively to Railway's native internal IPv6 DNS engine
    resolver [fd12::10] valid=5s;

    # Universal proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Dynamic lookups matching your runtime container keys
    location / {
        set $cms_url "http://railway.internal";
        proxy_pass $cms_url;
    }

    location /cms/ {
        set $cms_url "http://railway.internal/";
        proxy_pass $cms_url;
    }

    location /tour/ {
        set $tour_url "http://railway.internal";
        proxy_pass $tour_url; 
    }

    location /remittance/ {
        set $remittance_url "http://railway.internal";
        proxy_pass $remittance_url; 
    }

    location /certificate/ {
        set $cert_url "http://railway.internal";
        proxy_pass $cert_url; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
