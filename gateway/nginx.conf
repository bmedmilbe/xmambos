server {
    listen 80;

    # 1. Use standard local caching DNS to safely resolve .internal routes at runtime
    resolver 13.107.21.200 valid=10s;

    # Universal proxy configurations to keep it DRY
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # 2. Define service target variables to bypass structural boot-time checks
    # Note: On Railway, the container default internal exposed port is port 8000
    location / {
        set $cms_target "http://railway.internal";
        proxy_pass $cms_target;
    }

    location /cms/ {
        set $cms_target "http://railway.internal/";
        proxy_pass $cms_target;
    }

    location /tour/ {
        set $tour_target "http://railway.internal";
        proxy_pass $tour_target; 
    }

    location /remittance/ {
        set $remittance_target "http://railway.internal";
        proxy_pass $remittance_target; 
    }

    location /certificate/ {
        set $certificate_target "http://railway.internal";
        proxy_pass $certificate_target; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
