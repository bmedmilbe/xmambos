# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

server {
    # Escuta na porta dinâmica da Railway
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # 🚨 CRUCIAL: O DNS interno da Railway que vai resolver as variáveis em tempo de execução
    resolver 127.0.0.11 [fd12::10] valid=5s ipv6=on;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # Preserva o Host original para o django-tenants funcionar perfeitamente
    proxy_set_header Host $host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT / WORDPRESS
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # 🔄 O TRUQUE: Definir os alvos em variáveis locais força o Nginx a aceitar o boot
    
    # Rota de Certificados
    location /certificate/ {
        set $target_certificate http://certificate.railway.internal:8000/;
        proxy_pass $target_certificate;
    }

    # Rota de Remessas
    location /remittance/ {
        set $target_remittance http://remittance.railway.internal:8000/;
        proxy_pass $target_remittance;
    }

    # Rota de Turismo
    location /tour/ {
        set $target_tour http://tour.railway.internal:8000/;
        proxy_pass $target_tour;
    }

    # Rota do CMS explicitada
    location /cms/ {
        set $target_cms http://cms.railway.internal:8000/;
        proxy_pass $target_cms;
    }

    # Rota raiz e fallbacks com Rate Limiting
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        set $target_root http://cms.railway.internal:8000;
        proxy_pass $target_root;
    }

    # Entrega de arquivos estáticos locais
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}