server {
    listen ${PORT}; 
    server_name teladoshi.com *.teladoshi.com;

    # OBRIGATÓRIO: Força o Nginx a buscar o IP na tabela de DNS IPv6 da Railway
    resolver [fd12::10] ipv6=on valid=1s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location / {
        proxy_pass http://${CMS_URL};
    }

    location /cms/ {
        proxy_pass http://${CMS_URL}/;
    }

    location /tour/ {
        proxy_pass http://${TOUR_URL}/; 
    }

    location /remittance/ {
        proxy_pass http://${REMITTANCE_URL}/; 
    }

    location /certificate/ {
        proxy_pass http://${CERTIFICATE_URL}/; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
