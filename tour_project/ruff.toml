# Target code compatibility rule sets directly at the root level
target-version = "py310"
line-length = 88

# Changed from [tool.ruff.lint] to just [lint]
[lint]
select = ["E", "W", "F", "I", "UP"]
ignore = []

exclude = [
    "**/migrations/*.py",
    ".git",
    "__pycache__",
]

# Changed from [tool.ruff.format] to just [format]
[format]
quote-style = "double"
indent-style = "space"
