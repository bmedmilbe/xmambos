upstream cms_service {
    server cms.railway.internal fail_timeout=0 max_fails=0;
}
upstream tour_service {
    server tour.railway.internal fail_timeout=0 max_fails=0;
}
upstream remittance_service {
    server remittance.railway.internal fail_timeout=0 max_fails=0;
}
upstream certificate_service {
    server certificate.railway.internal fail_timeout=0 max_fails=0;
}

server {
    listen 80;

    # REMOVE any "resolver" definitions. Let Nginx consume host files directly.

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location / {
        proxy_pass http://cms_service;
    }

    location /cms/ {
        proxy_pass http://cms_service/;
    }

    location /tour/ {
        proxy_pass http://tour_service/; 
    }

    location /remittance/ {
        proxy_pass http://remittance_service/; 
    }

    location /certificate/ {
        proxy_pass http://certificate_service/; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
