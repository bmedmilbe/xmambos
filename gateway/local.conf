# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

# 🌐 Criação de Upstream com Fallback Dinâmico
# Mapear o CMS via upstream elimina o erro de conversão de string do IPv6 da Railway
upstream cms_cluster {
    server cms.railway.internal:8000 max_fails=3 fail_timeout=10s;
}

server {
    # Escuta na porta dinâmica da Railway
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # DNS padrão interno para failover
    resolver 127.0.0.11 [fd12::10] valid=5s;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # 🚨 CRUCIAL PARA DJANGO-TENANTS: Preserva e encaminha o Host original intacto
    proxy_set_header Host $http_host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT / WORDPRESS
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # 🔄 ROTAS SECUNDÁRIAS (Mantidas dinâmicas para não travar o boot do Gateway se estiverem offline)
    location /certificate/ {
        set $certificate_url certificate.railway.internal:8000;
        proxy_pass http://$certificate_url/;
    }

    location /remittance/ {
        set $remittance_url remittance.railway.internal:8000;
        proxy_pass http://$remittance_url/;
    }

    location /tour/ {
        set $tour_url tour.railway.internal:8000;
        proxy_pass http://$tour_url/;
    }

    location /cms/ {
        proxy_pass http://cms_cluster/;
    }

    # 🎯 ROTA RAIZ (Ponte Direta e Estabilizada para o CMS Principal)
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        
        # Passar diretamente para o cluster resolve o empasse de comunicação do Gateway com o CMS
        proxy_pass http://cms_cluster;
    }

    # Entrega de arquivos estáticos locais
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}