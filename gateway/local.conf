server {
    listen ${PORT} default_server;
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    client_max_body_size 100M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /health {
        access_log off;
        return 200 "Gateway OK\n";
        add_header Content-Type text/plain;
    }

    location /debug-vars {
        access_log off;
        return 200 "CMS: ${CMS_IP}:8000\nTOUR: ${TOUR_IP}:8000\nREMITTANCE: ${REMITTANCE_IP}:8000\nCERTIFICATE: ${CERTIFICATE_IP}:8000\n";
        add_header Content-Type text/plain;
    }

    # ============ CMS ============
    location / {
        proxy_pass http://${CMS_IP}:8000/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /cms/ {
        proxy_pass http://${CMS_IP}:8000/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/cms/(.*) /$1 break;
    }

    # ============ TOUR ============
    location /tour/ {
        proxy_pass http://${TOUR_IP}:8000/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/tour/(.*) /$1 break;
    }

    # ============ REMITTANCE ============
    location /remittance/ {
        proxy_pass http://${REMITTANCE_IP}:8000/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/remittance/(.*) /$1 break;
    }

    # ============ CERTIFICATE ============
    location /certificates/ {
        proxy_pass http://${CERTIFICATE_IP}:8000/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/certificates/(.*) /$1 break;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}