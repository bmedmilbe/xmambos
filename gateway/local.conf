server {
    # Escuta na porta dinâmica injetada pela Railway
    listen ${PORT} default_server;
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # DNS interno obrigatório do Railway (revalida o IP a cada 30 segundos)
    resolver 127.0.0.11 8.8.8.8 valid=30s;

    # Redirect clean prefix paths to trailing slash so upstream path stripping works consistently.
    location = /certificates {
        return 301 $scheme://$host/certificates/;
    }
    location = /remittance {
        return 301 $scheme://$host/remittance/;
    }
    location = /tour {
        return 301 $scheme://$host/tour/;
    }
    location = /cms {
        return 301 $scheme://$host/cms/;
    }

    location /certificates/ {
        proxy_pass http://${CERTIFICATES_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /certificates;
        proxy_set_header X-Tenant $tenant;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_ssl_verify off;
    }

    location /remittance/ {
        proxy_pass http://${REMITTANCE_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /remittance;
        proxy_set_header X-Tenant $tenant;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_ssl_verify off;
    }

    location /tour/ {
        proxy_pass http://${TOUR_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /tour;
        proxy_set_header X-Tenant $tenant;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_ssl_verify off;
    }

    location /cms/ {
        proxy_pass http://${CMS_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /cms;
        proxy_set_header X-Tenant $tenant;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_ssl_verify off;
    }

    location / {
        proxy_pass http://${CMS_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Tenant $tenant;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_ssl_verify off;
    }
}