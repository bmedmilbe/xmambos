server {
    # Crucial for Railway: Nginx must listen on the public port injected on boot
    listen ${PORT}; 

    # Universal proxy header assignments
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Map paths straight to your dashboard template tokens
    location / {
        proxy_pass http://${CMS_URL};
    }

    location /cms/ {
        proxy_pass http://${CMS_URL}/;
    }

    location /tour/ {
        proxy_pass http://${TOUR_URL}/; 
    }

    location /remittance/ {
        proxy_pass http://${REMITTANCE_URL}/; 
    }

    location /certificate/ {
        proxy_pass http://${CERTIFICATE_URL}/; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
