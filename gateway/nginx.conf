server {
    listen ${PORT}; 

    # Add this line so Nginx can resolve Railway's internal domains dynamically
    resolver 127.0.0.11 valid=30s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location / {
        # Removed 'http://' from here since we are passing it cleanly via the variable
        proxy_pass http://${CMS_URL};
    }

    location /cms/ {
        proxy_pass http://${CMS_URL}/;
    }

    location /tour/ {
        proxy_pass http://${TOUR_URL}/; 
    }

    location /remittance/ {
        proxy_pass http://${REMITTANCE_URL}/; 
    }

    location /certificate/ {
        proxy_pass http://${CERTIFICATE_URL}/; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}