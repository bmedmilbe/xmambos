server {
    # Listen on port 80. Railway's network mesh routes the public domain here.
    listen 80; 

    # REMOVE any "resolver" rows. Nginx will consume the OS host definitions natively.

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Map directly onto your short manual service hostnames over port 8000
    location / {
        set $cms_url "http://cms:8000";
        proxy_pass $cms_url;
    }

    location /cms/ {
        set $cms_url "http://cms:8000/";
        proxy_pass $cms_url;
    }

    location /tour/ {
        set $tour_url "http://tour:8000/";
        proxy_pass $tour_url; 
    }

    location /remittance/ {
        set $rem_url "http://remittance:8000/";
        proxy_pass $rem_url; 
    }

    location /certificate/ {
        set $cert_url "http://certificate:8000/";
        proxy_pass $cert_url; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
