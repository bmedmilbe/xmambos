server {
    # Crucial: Must listen on the dynamic port injected by Railway
    listen ${PORT}; 

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Map directly onto your manual card names using the dynamic template variables
    location / {
        proxy_pass http://${CMS_URL};
    }

    location /cms/ {
        proxy_pass http://${CMS_URL}/;
    }

    location /tour/ {
        proxy_pass http://${TOUR_URL}/; 
    }

    location /remittance/ {
        proxy_pass http://${REMITTANCE_URL}/; 
    }

    location /certificate/ {
        proxy_pass http://${CERTIFICATE_URL}/; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
