
server {
    listen 8080 default_server;
    server_name teladoshi.com localhost;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;
    
    client_max_body_size 100M;

    # Health check
    location /health {
        access_log off;
        return 200 "Gateway OK\n";
        add_header Content-Type text/plain;
    }

    # Debug
    location /debug-vars {
        access_log off;
        return 200 "CMS_URL: $CMS_URL\nTOUR_URL: $TOUR_URL\nREMITTANCE_URL: $REMITTANCE_URL\nCERTIFICATE_URL: $CERTIFICATE_URL\n";
        add_header Content-Type text/plain;
    }

    # Rota principal - força o host correto
    location / {
        proxy_pass http://$CMS_URL/;
        proxy_set_header Host teladoshi.com;  # FORÇA O HOST CORRETO
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    }

    # Rota /cms/
    location /cms/ {
        proxy_pass http://$CMS_URL/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        rewrite ^/cms/(.*) /$1 break;
    }

    # Rota /api/ e outras
    location /api/ {
        proxy_pass http://$CMS_URL/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    }
}
