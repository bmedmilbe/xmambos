server {
    # Listen on the public port injected by Railway
    listen 80; 

    # Force runtime address mapping lookup checks via local hostname files
    resolver 127.0.0.11 valid=5s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Map directly onto the clean dashboard service cards via dynamic variables
    location / {
        set $cms_backend "http://cms:8000";
        proxy_pass $cms_backend;
    }

    location /cms/ {
        set $cms_backend "http://cms:8000/";
        proxy_pass $cms_backend;
    }

    location /tour/ {
        set $tour_backend "http://tour:8000/";
        proxy_pass $tour_backend; 
    }

    location /remittance/ {
        set $remittance_backend "http://remittance:8000/";
        proxy_pass $remittance_backend; 
    }

    location /certificate/ {
        set $cert_backend "http://certificate:8000/";
        proxy_pass $cert_backend; 
    }

    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
