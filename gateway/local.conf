# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

server {
    # Escuta na porta dinâmica da Railway
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # 🚨 OBRIGATÓRIO: Aponta para o DNS interno da Railway para resolver as variáveis em runtime
    resolver 127.0.0.11 [fd12::10] valid=5s ipv6=on;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # Preserva o Host original para o django-tenants funcionar perfeitamente
    proxy_set_header Host $host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT / WORDPRESS
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # 🔄 Rotas com Truque de Variável para Ignorar Checagem de Boot (Strictly Dynamic)

    location /certificate/ {
        set $cert_upstream http://certificate.railway.internal:8000;
        proxy_pass $cert_upstream/;
    }

    location /remittance/ {
        set $remit_upstream http://remittance.railway.internal:8000;
        proxy_pass $remit_upstream/;
    }

    location /tour/ {
        set $tour_upstream http://tour.railway.internal:8000;
        proxy_pass $tour_upstream/;
    }

    location /cms/ {
        set $cms_upstream http://cms.railway.internal:8000;
        proxy_pass $cms_upstream/;
    }

    # Rota raiz direcionada ao CMS
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        set $root_upstream http://cms.railway.internal:8000;
        proxy_pass $root_upstream;
    }

    # Entrega de arquivos estáticos locais
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}