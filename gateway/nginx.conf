server {
    listen 80;

    # Universal proxy configurations to keep things DRY
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # 1. Use short hostnames directly inside proxy_pass
    location / {
        proxy_pass http://cms:8000;
    }

    location /cms/ {
        proxy_pass http://cms:8000/;
    }

    location /tour/ {
        proxy_pass http://tour:8000/; 
    }

    location /remittance/ {
        proxy_pass http://remittance:8000/; 
    }

    location /certificate/ {
        proxy_pass http://certificate:8000/; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
