upstream cms_cluster {
    server cms.railway.internal:8000 fail_timeout=0 max_fails=0;
}
upstream tour_cluster {
    server tour.railway.internal:8000 fail_timeout=0 max_fails=0;
}
upstream remittance_cluster {
    server remittance.railway.internal:8000 fail_timeout=0 max_fails=0;
}
upstream certificate_cluster {
    server certificate.railway.internal:8000 fail_timeout=0 max_fails=0;
}

server {
    # Listen on port 80. Railway's public router automatically connects to it.
    listen 80; 

    # Production Proxy Buffers to handle large Django headers cleanly
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Universal proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_redirect off;

    # Map paths straight to the hardcoded upstream cluster pools
    location / {
        proxy_pass http://cms_cluster;
    }

    location /cms/ {
        proxy_pass http://cms_cluster/;
    }

    location /tour/ {
        proxy_pass http://tour_cluster/; 
    }

    location /remittance/ {
        proxy_pass http://remittance_cluster/; 
    }

    location /certificate/ {
        proxy_pass http://certificate_cluster/; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
