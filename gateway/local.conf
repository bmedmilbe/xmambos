# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

server {
    # Escuta na porta dinâmica da Railway
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # 🚨 O SEGREDO: Usamos o DNS interno padrão do Docker/Railway.
    # Ao usar variáveis no proxy_pass, o Nginx adia a checagem de DNS e não quebra no boot!
    resolver 127.0.0.11 [fd12::10] valid=5s ipv6=on;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # Preserva o Host original para o django-tenants funcionar perfeitamente
    proxy_set_header Host $host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT / WORDPRESS
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # 🔄 ROTAS DINÂMICAS: Sem blocos upstream estáticos para o boot NUNCA travar

    location /certificate/ {
        set $certificate_url certificate.railway.internal:8000;
        proxy_pass http://$certificate_url/;
    }

    location /remittance/ {
        set $remittance_url remittance.railway.internal:8000;
        proxy_pass http://$remittance_url/;
    }

    location /tour/ {
        set $tour_url tour.railway.internal:8000;
        proxy_pass http://$tour_url/;
    }

    location /cms/ {
        set $cms_url cms.railway.internal:8000;
        proxy_pass http://$cms_url/;
    }

    # Rota raiz direcionada ao CMS principal
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        set $root_url cms.railway.internal:8000;
        proxy_pass http://$root_url;
    }

    # Entrega de arquivos estáticos locais
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}