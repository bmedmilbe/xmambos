# No seu projeto local, no diretório gateway/
cat > docker-entrypoint.sh << 'EOF'
#!/bin/sh

echo "=== Gateway Starting ==="

# Função para resolver IP
resolve_ip() {
    local service=$1
    local ip=$(nslookup $service.railway.internal 2>/dev/null | grep "Address" | tail -1 | awk '{print $2}')
    if [ -z "$ip" ]; then
        echo "$service.railway.internal"
    else
        echo "$ip"
    fi
}

CMS_IP=$(resolve_ip cms)
TOUR_IP=$(resolve_ip tour)
REMITTANCE_IP=$(resolve_ip remittance)
CERTIFICATE_IP=$(resolve_ip certificate)

echo "CMS_IP: $CMS_IP"
echo "TOUR_IP: $TOUR_IP"
echo "REMITTANCE_IP: $REMITTANCE_IP"
echo "CERTIFICATE_IP: $CERTIFICATE_IP"

# Gera a configuração com IPs resolvidos
cat > /etc/nginx/conf.d/default.conf << NGINX_CONF
server {
    listen 8080 default_server;
    server_name teladoshi.com localhost;

    client_max_body_size 100M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /health {
        access_log off;
        return 200 "Gateway OK\n";
        add_header Content-Type text/plain;
    }

    location /debug-vars {
        access_log off;
        return 200 "CMS: ${CMS_IP}:8000\nTOUR: ${TOUR_IP}:8000\nREMITTANCE: ${REMITTANCE_IP}:8000\nCERTIFICATE: ${CERTIFICATE_IP}:8000\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://${CMS_IP}:8000/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host \$http_host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /cms/ {
        proxy_pass http://${CMS_IP}:8000/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host \$http_host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/cms/(.*) /\$1 break;
    }

    location /tour/ {
        proxy_pass http://${TOUR_IP}:8000/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host \$http_host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/tour/(.*) /\$1 break;
    }

    location /remittance/ {
        proxy_pass http://${REMITTANCE_IP}:8000/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host \$http_host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/remittance/(.*) /\$1 break;
    }

    location /certificates/ {
        proxy_pass http://${CERTIFICATE_IP}:8000/;
        proxy_set_header Host teladoshi.com;
        proxy_set_header X-Forwarded-Host \$http_host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        rewrite ^/certificates/(.*) /\$1 break;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
NGINX_CONF

echo "=== Configuration generated ==="
nginx -t

exec nginx -g 'daemon off;'
EOF

chmod +x gateway/docker-entrypoint.sh