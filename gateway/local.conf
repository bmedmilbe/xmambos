# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

# 🌐 MAPA DE UPSTREAMS COM REDE PRIVADA DA RAILWAY
# Usar blocos upstream força o Nginx a tentar ler no boot. 
# Para os serviços que podem estar offline (certificate, remittance, tour), passamos a URL literal direto na rota.
upstream cms_backend {
    server cms.railway.internal:8000;
}

server {
    # Escuta na porta dinâmica da Railway
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # 🚨 CRUCIAL PARA DJANGO-TENANTS: Mantém o Host original (ex: admin.teladoshi.com)
    proxy_set_header Host $http_host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT / WORDPRESS
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # 🔄 ROTAS SECUNDÁRIAS PROTEGIDAS (Evita travar o boot se o container estiver parado)
    # Usar a URL completa dentro da variável sem o resolver quebrar
    
    location /certificate/ {
        proxy_pass http://certificate.railway.internal:8000/;
    }

    location /remittance/ {
        proxy_pass http://remittance.railway.internal:8000/;
    }

    location /tour/ {
        proxy_pass http://tour.railway.internal:8000/;
    }

    location /cms/ {
        proxy_pass http://cms_backend/;
    }

    # 🎯 ROTA RAIZ DIRETA PARA O CMS (Estabilizada e funcional)
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://cms_backend;
    }

    # Entrega de arquivos estáticos locais
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}