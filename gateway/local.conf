# Configura a limitação de taxa: permite até 10 requisições por segundo por endereço IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

server {
    # Escuta na porta dinâmica da Railway
    listen ${PORT} default_server;
    
    server_name teladoshi.com localhost ~^(?<tenant>.+)\.localhost\.(local|com)$ ~^(?<tenant>.+)\.teladoshi\.(local|com)$;

    # DNS interno padrão da Railway
    resolver 127.0.0.11 [fd12::10] valid=5s;

    # Configurações padrões compartilhadas para os proxies
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # 🚨 CRUCIAL: Encaminha o Host exato para o django-tenants funcionar
    proxy_set_header Host $http_host;
    proxy_set_header X-Tenant $tenant;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ PROTEÇÃO ANTI-BOT / WORDPRESS
    location ~* \.(php|env|bak|config|sql|ini)$ {
        deny all;
        access_log off;
    }
    location ~* /(wp-admin|wp-content|wp-includes|wp-json|webmin|webhook) {
        deny all;
        access_log off;
    }

    # 🔄 ROTAS INTERNAS DIRETAS (Sem variáveis soltas no proxy_pass)

    location /certificate/ {
        proxy_pass http://certificate.railway.internal:8000/;
    }

    location /remittance/ {
        proxy_pass http://remittance.railway.internal:8000/;
    }

    location /tour/ {
        proxy_pass http://tour.railway.internal:8000/;
    }

    location /cms/ {
        proxy_pass http://cms.railway.internal:8000/;
    }

    # 🎯 ROTA RAIZ (Ponte direta com o CMS)
    location / {
        limit_req zone=mylimit burst=20 nodelay;
        proxy_pass http://cms.railway.internal:8000;
    }

    # Entrega de arquivos estáticos locais
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}