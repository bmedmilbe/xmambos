server {
    listen 80;

    # 1. Use Railway's local machine routing maps directly.
    # We drop the 'resolver' line so Nginx naturally scans /etc/hosts configurations.

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # 2. Map directly using your clean Dashboard Service Hostnames
    location / {
        set $cms_url "http://cms:8000";
        proxy_pass $cms_url;
    }

    location /cms/ {
        set $cms_url "http://cms:8000/";
        proxy_pass $cms_url;
    }

    location /tour/ {
        set $tour_url "http://tour:8000/"; 
        proxy_pass $tour_url; 
    }

    location /remittance/ {
        set $remittance_url "http://remittance:8000/"; 
        proxy_pass $remittance_url; 
    }

    location /certificate/ {
        set $cert_url "http://certificate:8000/"; 
        proxy_pass $cert_url; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
