# 1. Define clean upstreams pointing to your manual short card names with non-blocking parameters
upstream cms_app {
    server cms:8000 fail_timeout=0 max_fails=0;
}
upstream tour_app {
    server tour:8000 fail_timeout=0 max_fails=0;
}
upstream remittance_app {
    server remittance:8000 fail_timeout=0 max_fails=0;
}
upstream certificate_app {
    server certificate:8000 fail_timeout=0 max_fails=0;
}

server {
    # Listen on port 80. Railway's public router maps your domain here natively.
    listen 80; 

    # NO resolver line. Nginx will read the system host maps directly via upstream blocks.

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # 2. Proxy directly to the upstream names without variable wrapping
    location / {
        proxy_pass http://cms_app;
    }

    location /cms/ {
        proxy_pass http://cms_app/;
    }

    location /tour/ {
        proxy_pass http://tour_app/; 
    }

    location /remittance/ {
        proxy_pass http://remittance_app/; 
    }

    location /certificate/ {
        proxy_pass http://certificate_app/; 
    }
    
    location /static/ {
        alias /home/app/web/staticfiles/;
    }
}
